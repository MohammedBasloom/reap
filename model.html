  <script>
    // Patch ResizeObserver to swallow benign loop-completion warnings.
    (function(){
      if (typeof ResizeObserver !== "undefined") {
        const Orig = ResizeObserver;
        window.ResizeObserver = class PatchedRO extends Orig {
          constructor(cb) {
            super((entries, obs) => {
              window.requestAnimationFrame(() => {
                try { cb(entries, obs); } catch(e) {}
              });
            });
          }
        };
      }
      const RO = "ResizeObserver loop";
      window.addEventListener("error", function(e){
        if (e && e.message && e.message.indexOf(RO) !== -1) {
          e.stopImmediatePropagation(); e.preventDefault(); return false;
        }
      }, true);
      const ce = console.error, cw = console.warn;
      console.error = function(...a){ if (a[0] && String(a[0]).indexOf(RO) !== -1) return; return ce.apply(console, a); };
      console.warn  = function(...a){ if (a[0] && String(a[0]).indexOf(RO) !== -1) return; return cw.apply(console, a); };
    })();
  </script>
